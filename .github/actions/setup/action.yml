name: Setup
description: Install pnpm and Node.js (versions from package.json / .nvmrc) and install dependencies from the lockfile

runs:
    using: composite
    steps:
        # Version comes from the `packageManager` field in package.json
        - uses: pnpm/action-setup@v6

        - uses: actions/setup-node@v7
          with:
              node-version-file: .nvmrc
              cache: pnpm

        # Also runs `prisma generate` (postinstall)
        - name: Install dependencies
          shell: bash
          run: pnpm install --frozen-lockfile
